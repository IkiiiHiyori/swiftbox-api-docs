site_name: SwiftBox Help Center
site_url: https://swiftbox-docs.example.com
repo_url: https://github.com/swiftbox/help-center
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: en
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.sections
    - navigation.top
    - content.action.edit

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Order Tracking: tracking.md
  - Pricing & Billing: billing.md
  - Partner API: api.md

plugins:
  - search:
      lang: en
  - minify

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - codehilite
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: material/email
      link: mailto:support@swiftbox.com
      name: Email SwiftBox Support
    - icon: fontawesome/brands/github
      link: https://github.com/swiftbox/help-center
      name: SwiftBox Help Center on GitHub
  analytics:
    provider: google
    property: G-XXXXXXXXXX

copyright: Copyright &copy; 2025 SwiftBox
